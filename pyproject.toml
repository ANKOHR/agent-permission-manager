[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-permission-manager"
version = "0.1.0"
description = "Deterministic permission decisions from explicit risk signals"
requires-python = ">=3.10"

[project.scripts]
apm = "agent_permission_manager.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
